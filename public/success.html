<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Order status | iFruit</title><style>body{background:#000;color:#fff;font:16px Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}main{max-width:540px;width:100%;background:#121212;border:1px solid #333;border-radius:16px;padding:38px;box-sizing:border-box}h1{text-transform:uppercase;font-size:38px;line-height:1.05;margin:0 0 20px}p{color:#aaa;line-height:1.6;overflow-wrap:anywhere}a{display:inline-block;background:#fcaf17;padding:14px 20px;text-decoration:none;color:black;border-radius:5px;font-weight:bold;margin-top:16px}</style></head><body><main><h1 id="headline">Checking payment status...</h1><p id="message">Verifying your checkout directly with the payment provider.</p><p id="reference"></p><a href="/">Back to iFruit</a></main><script>const id=new URLSearchParams(location.search).get('session_id'),head=document.getElementById('headline'),message=document.getElementById('message'),ref=document.getElementById('reference');if(!id){head.textContent='No order to verify';message.textContent='No checkout session was supplied.'}else fetch('/api/checkout-status?session_id='+encodeURIComponent(id)).then(async r=>{const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to verify');if(data.paymentStatus==='paid'){head.textContent='Payment confirmed';message.textContent='Stripe confirms your payment. Keep your Stripe receipt. The merchant must separately confirm the order and shipping.'}else{head.textContent='Payment not confirmed';message.textContent='Stripe has not marked this payment as paid. If you were charged, contact the merchant with the reference below.'}ref.textContent='Reference: '+data.orderReference}).catch(e=>{head.textContent='Verification unavailable';message.textContent=e.message;ref.textContent='Check your Stripe payment receipt.'});</script></body></html>
